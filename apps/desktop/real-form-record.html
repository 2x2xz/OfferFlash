<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>OfferFlash · 真实企业页录制</title><style>*{box-sizing:border-box}body{margin:0;background:#111722;color:#e1e9f6;font:13px -apple-system,"PingFang SC",sans-serif}.bar{height:116px;padding:15px 22px}.row{display:flex;align-items:center;gap:12px}h1{font-size:19px;margin:0;flex:1}small{color:#e8be77}button{border:1px solid #485670;border-radius:6px;padding:9px 15px;background:#243047;color:#e1e9f6;cursor:pointer;font:inherit}button.primary{background:#ffd16a;color:#172030;border-color:#ffd16a;font-weight:600}button:disabled{opacity:.45;cursor:default}#status{margin-top:12px;color:#b6c6df;line-height:1.5}#details{margin-left:10px;color:#e4bd78}</style></head><body><div class="bar"><div class="row"><h1>ϟ OfferFlash · 真实企业页录制</h1><small>仅虚构履历 · 不提交 · 独立资料与登录</small><button id="inspect">只读检查</button><button id="start" class="primary">开始自动填写并录制</button><button id="stop">停止</button></div><div id="status">请手动登录面壁智能，进入申请表。点击“只读检查”核对是否是空白演示页；登录过程不会录制。<span id="details"></span></div></div><script>
const status=document.getElementById('status');for(const name of ['inspect','start','stop'])document.getElementById(name).addEventListener('click',async()=>{try{const result=await window.recordDemo[name]();if(result?.message)status.textContent=result.message;}catch{status.textContent='操作未完成，请查看状态；未提交申请。';}});
window.addEventListener('record-status',event=>{status.textContent=event.detail.message;document.getElementById('start').disabled=event.detail.busy;document.getElementById('inspect').disabled=event.detail.busy;});</script></body></html>
